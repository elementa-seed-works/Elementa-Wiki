name: Notion → Wiki Sync

on:
  schedule:
    # 매시간 정각(UTC) 실행. GitHub 부하에 따라 몇 분 지연될 수 있습니다.
    - cron: "0 * * * *"
  workflow_dispatch: {} # 수동 실행 버튼

# 위키(같은 저장소의 .wiki.git)에 push 하기 위한 권한
permissions:
  contents: write

# 겹쳐 실행되지 않도록
concurrency:
  group: notion-wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃 (스크립트용)
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        working-directory: scripts/notion-wiki-sync
        run: npm ci || npm install

      - name: 위키 저장소 clone
        # WIKI_TOKEN(개인 PAT)이 있으면 그것을, 없으면 기본 GITHUB_TOKEN 을 사용.
        # 조직 정책으로 기본 토큰 쓰기가 막힌 경우 WIKI_TOKEN(classic PAT, repo 스코프)을 등록하면 된다.
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Notion → 마크다운 동기화
        working-directory: scripts/notion-wiki-sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ vars.NOTION_ROOT_PAGE_ID }}
          NOTION_HOME_PAGE_ID: ${{ vars.NOTION_HOME_PAGE_ID }}
          OUTPUT_DIR: ${{ github.workspace }}/wiki
        run: node sync.mjs

      - name: 변경사항 commit & push
        working-directory: wiki
        run: |
          git config user.name "notion-wiki-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경사항 없음 — push 생략"
          else
            git commit -m "chore: Notion 자동 동기화 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # 위키의 기본 브랜치(master 또는 main)로 그대로 push
            git push origin "HEAD:$(git rev-parse --abbrev-ref HEAD)"
          fi
