name: Notion → Wiki Sync

on:
  schedule:
    # 매시간 정각(UTC) 실행. GitHub 부하에 따라 몇 분 지연될 수 있습니다.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# 위키(같은 저장소의 .wiki.git)에 push 하기 위한 권한
permissions:
  contents: write

# 겹쳐 실행되지 않도록
concurrency:
  group: notion-wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃 (스크립트용)
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        working-directory: scripts/notion-wiki-sync
        run: npm ci || npm install

      - name: 위키 저장소 clone
        # 미리보기 실행에서는 push 하지 않으므로 clone 도 건너뛴다(위키 쓰기 권한 없이도 돌아감).
        if: github.event.inputs.dry_run != 'true'
        # WIKI_TOKEN(개인 PAT)이 있으면 그것을, 없으면 기본 GITHUB_TOKEN 을 사용.
        # 조직 정책으로 기본 토큰 쓰기가 막힌 경우 WIKI_TOKEN(classic PAT, repo 스코프)을 등록하면 된다.
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Notion → 마크다운 동기화
        id: sync
        working-directory: scripts/notion-wiki-sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ vars.NOTION_ROOT_PAGE_ID }}
          NOTION_HOME_PAGE_ID: ${{ vars.NOTION_HOME_PAGE_ID }}
          # 아래 셋은 선택. 미등록이면 빈 값이라 스크립트가 기본 동작으로 넘어간다.
          NOTION_DB_PARENT_PROP: ${{ vars.NOTION_DB_PARENT_PROP }}
          NOTION_SKIP_IDS: ${{ vars.NOTION_SKIP_IDS }}
          WIKI_TITLE: ${{ vars.WIKI_TITLE }}
          OUTPUT_DIR: ${{ github.workspace }}/wiki
        run: node sync.mjs

      - name: 산출물 아티팩트 업로드 (미리보기 실행)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wiki-preview
          path: wiki
          retention-days: 7

      - name: 변경사항 commit & push
        id: push
        if: github.event.inputs.dry_run != 'true'
        working-directory: wiki
        run: |
          git config user.name "notion-wiki-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경사항 없음 — push 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "files_changed=0" >> "$GITHUB_OUTPUT"
          else
            count=$(git diff --cached --name-only | wc -l)
            git commit -m "chore: Notion 자동 동기화 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # 위키의 기본 브랜치(master 또는 main)로 그대로 push
            git push origin "HEAD:$(git rev-parse --abbrev-ref HEAD)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "files_changed=$count" >> "$GITHUB_OUTPUT"
          fi

      # 앞 단계가 실패해도 알림은 보낸다. DISCORD_WEBHOOK_URL 이 없으면 스크립트가 알아서 빠진다.
      # 미리보기 실행은 위키를 바꾸지 않으므로 알리지 않는다.
      - name: Discord 알림
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_ON: ${{ vars.DISCORD_NOTIFY_ON }}
          JOB_STATUS: ${{ job.status }}
          CHANGED: ${{ steps.push.outputs.changed }}
          FILES_CHANGED: ${{ steps.push.outputs.files_changed }}
          ROOT_TITLE: ${{ steps.sync.outputs.root_title }}
          PAGES_FOUND: ${{ steps.sync.outputs.pages_found }}
          FILES_WRITTEN: ${{ steps.sync.outputs.files_written }}
          PAGE_ERRORS: ${{ steps.sync.outputs.page_errors }}
          FAILED_TITLES: ${{ steps.sync.outputs.failed_titles }}
          IMAGES_DOWNLOADED: ${{ steps.sync.outputs.images_downloaded }}
          ELAPSED_SEC: ${{ steps.sync.outputs.elapsed_sec }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WIKI_URL: ${{ github.server_url }}/${{ github.repository }}/wiki
        run: node .github/scripts/discord-notify.mjs
